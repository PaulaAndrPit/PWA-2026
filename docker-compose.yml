services:
  db:
    image: postgres:16-bullseye
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./backend/postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"     
    networks:
      red:
networks:
  red: